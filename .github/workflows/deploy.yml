# main에 push될 때마다 GitHub Pages로 자동 배포
# 사전 준비(1회): 저장소 Settings → Secrets and variables → Actions에
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 두 개를 등록할 것
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 저장소 이름 하위 경로(https://<user>.github.io/<repo>/)로 서빙되므로 base 지정.
      # 저장소 이름에서 자동으로 가져오므로 repo를 rename해도 그대로 동작한다.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      # 첫 실행 시 Pages를 자동 활성화
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
